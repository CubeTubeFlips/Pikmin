<!doctype html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Insert Pikmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>


    <link rel="stylesheet" href="bloom.css">
</head>

<body class="page-insert">

    <!--NOTE FOR USE BECAUSE I WAS HAVING TROUBLE, OPEN THE THING AT http://localhost/insert.html
    Make sure everything is reloaded and up-to-date before use, when I make sure to tick all of these boxes, the insert actually works!-->

    <h1>Add a New Pikmin</h1>

    <p><a href='index.html'>View the Database</a></p>
    <!--<p><a href='edit.html'>Edit an Existing Entry</a></p>-->

    <hr />

    <form id="insertForm">
        <div class="container">

            <div class="hero">
                <img src="pimage.png" alt="Pikmin Image">
            </div>

            <div id='invalid-form' class='alert alert-danger'>&nbsp;</div>

            <div class='row mb-3'>
                <div class='col-md-2'>
                    <label>Pikmin Type</label>
                </div>
                <div class='col-md-10'>
                    <select id='level'>
                        <option value=''></option>
                        <option value='Red Pikmin'>Red</option>
                        <option value='Blue Pikmin'>Blue</option>
                        <option value='Yellow Pikmin'>Yellow</option>
                        <option value='Purple Pikmin'>Purple</option>
                        <option value='Rock Pikmin'>Rock</option>
                        <option value='Winged Pikmin'>Winged</option>
                        <option value='Ice Pikmin'>Ice</option>
                        <option value='Glow Pikmin'>Glow</option>
                    </select>
                </div>
            </div>
            <div class='row mb-3'>
                <div id='level-error' class='col-12 text-danger'>&nbsp;</div>
            </div>

            <div class='row mb-3'>
                <div class='col-md-2'>
                    <label>Weight Units</label>
                </div>
                <div class='col-md-10'>
                    <input id='weight' type='text' />
                </div>
            </div>
            <div class='row mb-3'>
                <div id='weight-error' class='col-12 text-danger'>&nbsp;</div>
            </div>

            <div class='row mb-3'>
                <div class='col-md-2'>
                    <label>Can it fly?</label>
                </div>
                <div class='col-md-10'>
                    <input id='fly' type='checkbox' />
                </div>
            </div>
            <div class='row mb-3'>
                <div id='fly-error' class='col-12 text-danger'>&nbsp;</div>
            </div>

            <div class='row mb-3'>
                <div class='col-md-2'>
                    <label>Specific Game</label>
                </div>
                <div class='col-md-10'>
                    <select id='game'>
                        <option value=''> </option>
                        <option value='1'>Pikmin</option>
                        <option value='2'>Pikmin 2</option>
                        <option value='3'>Pikmin 3</option>
                        <option value='4'>Pikmin 4</option>
                        <option value='5'>Hey! Pikmin</option>
                        <option value='6'>Pikmin Bloom</option>
                    </select>
                </div>
            </div>
            <div class='row mb-3'>
                <div id='game-error' class='col-12 text-danger'>&nbsp;</div>
            </div>

            <div class='row mb-3'>
                <div class='col-md-2'>
                    <label>Release Year</label>
                </div>
                <div class='col-md-10'>
                    <input id='year' type='text' />
                </div>
            </div>
            <div class='row mb-3'>
                <div id='year-error' class='col-12 text-danger'>&nbsp;</div>
            </div>


            <div class='row mb-3'>
                <div class='col-md-2'>
                    <label>Game is good?</label>
                </div>
                <div class='col-md-10'>
                    <input id='goodness' type='checkbox' />
                </div>
            </div>
            <div class='row mb-3'>
                <div id='goodness-error' class='col-12 text-danger'>&nbsp;</div>
            </div>

            <div class='row mb-3'>
                <div class='col-md-12'>
                    <button type="submit">Insert Pikmin</button>
                </div>
            </div>

        </div>

        <hr />
    </form>

    <script>
        const errorBanner = document.getElementById('invalid-form');
        errorBanner.hidden = true;

        function clearFieldErrors() {
            const errorMessages = document.getElementsByClassName('text-danger');
            for (let htmlElement of errorMessages) {
                htmlElement.innerHTML = '&nbsp;';
            }
        }

        document.getElementById('insertForm').addEventListener('submit', () => {
            event.preventDefault();

            const formData = new FormData();
            formData.set('level', document.getElementById('level').value.trim());
            formData.set('weight', document.getElementById('weight').value.trim());
            formData.set('fly', document.getElementById('fly').checked ? 1 : 0);
            formData.set('game', document.getElementById('game').value.trim());
            formData.set('year', document.getElementById('year').value);
            formData.set('goodness', document.getElementById('goodness').checked ? 1 : 0);

            errorBanner.hidden = true;
            clearFieldErrors();

            fetch("http://localhost/pikmin/insert", {
                method: 'POST',
                body: formData
            })
                .then(async (response) => {
                    const json = await response.json().catch(() => null);
                    return { status: response.status, json };
                })
                .then(({ status, json }) => {

                    if (status === 400 && json && Array.isArray(json.errors)) {
                        errorBanner.innerText = 'Form has errors. Please correct them and resubmit.';
                        errorBanner.hidden = false;

                        for (let err of json.errors) {
                            const fieldName = err.path;
                            const errorId = fieldName + '-error';
                            const el = document.getElementById(errorId);
                            if (el) {
                                el.innerText = err.msg;
                            }
                        }
                        return;
                    }

                    if (status >= 200 && status < 300) {
                        errorBanner.hidden = true;
                        alert("Insert successful!");
                    } else {
                        console.error('Server returned status', status, json);
                        errorBanner.innerText = 'Server error. See console for details.';
                        errorBanner.hidden = false;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    errorBanner.innerText = 'Network error. See console for details.';
                    errorBanner.hidden = false;
                });

            return;
        });
    </script>

</body>

</html>
