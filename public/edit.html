<!doctype html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Edit Pikmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>


    <link rel="stylesheet" href="bloom.css">
</head>

<body class="page-edit">

    <h1>Edit an Existing Pikmin</h1>

    <p><a href='index.html'>View the Database</a></p>
    <p><a href='insert.html'>Add A New Pikmin</a></p>

    <hr />

    <form id="editForm">
        <div class="container">

            <div class="hero">
                <img src="yimage.png" alt="Yellow Image">
            </div>

            <div id='invalid-form' class='alert alert-danger'>&nbsp;</div>
            <div id='success-form' class='alert alert-success'>&nbsp;</div>

            <div class='row mb-3'>
                <div class='col-md-2'><label>Pikmin Type</label></div>
                <div class='col-md-10'>
                    <select id='level'>
                        <option value=''></option>
                        <option value='Red Pikmin'>Red</option>
                        <option value='Blue Pikmin'>Blue</option>
                        <option value='Yellow Pikmin'>Yellow</option>
                        <option value='Purple Pikmin'>Purple</option>
                        <option value='Rock Pikmin'>Rock</option>
                        <option value='Winged Pikmin'>Winged</option>
                        <option value='Ice Pikmin'>Ice</option>
                        <option value='Glow Pikmin'>Glow</option>
                    </select>
                </div>
            </div>
            <div class='row mb-3'>
                <div id='level-error' class='col-12 text-danger'>&nbsp;</div>
            </div>

            <div class='row mb-3'>
                <div class='col-md-2'><label>Weight Units</label></div>
                <div class='col-md-10'><input id='weight' type='text' /></div>
            </div>
            <div class='row mb-3'>
                <div id='weight-error' class='col-12 text-danger'>&nbsp;</div>
            </div>

            <div class='row mb-3'>
                <div class='col-md-2'><label>Can it fly?</label></div>
                <div class='col-md-10'><input id='fly' type='checkbox' /></div>
            </div>
            <div class='row mb-3'>
                <div id='fly-error' class='col-12 text-danger'>&nbsp;</div>
            </div>

            <div class='row mb-3'>
                <div class='col-md-2'><label>Specific Game</label></div>
                <div class='col-md-10'>
                    <select id='game'>
                        <option value=''></option>
                        <option value='1'>Pikmin</option>
                        <option value='2'>Pikmin 2</option>
                        <option value='3'>Pikmin 3</option>
                        <option value='4'>Pikmin 4</option>
                        <option value='5'>Hey! Pikmin</option>
                        <option value='6'>Pikmin Bloom</option>
                    </select>
                </div>
            </div>
            <div class='row mb-3'>
                <div id='game-error' class='col-12 text-danger'>&nbsp;</div>
            </div>

            <div class='row mb-3'>
                <div class='col-md-2'><label>Release Year</label></div>
                <div class='col-md-10'><input id='year' type='text' /></div>
            </div>
            <div class='row mb-3'>
                <div id='year-error' class='col-12 text-danger'>&nbsp;</div>
            </div>

            <div class='row mb-3'>
                <div class='col-md-2'><label>Game is good?</label></div>
                <div class='col-md-10'><input id='goodness' type='checkbox' /></div>
            </div>
            <div class='row mb-3'>
                <div id='goodness-error' class='col-12 text-danger'>&nbsp;</div>
            </div>

            <div class='row mb-3'>
                <div class='col-md-12'>
                    <button type="submit">Update Pikmin</button>
                </div>
            </div>

        </div>
    </form>

    <script>
        const errorBanner = document.getElementById('invalid-form');
        const successBanner = document.getElementById('success-form');
        errorBanner.hidden = true;
        successBanner.hidden = true;

        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        function clearFieldErrors() {
            const errorMessages = document.getElementsByClassName('text-danger');
            for (let el of errorMessages) {
                el.innerHTML = '&nbsp;';
            }
        }

        fetch(`http://localhost/pikmin/${id}`)
            .then(res => res.json())
            .then(json => {
                const data = json.data;

                document.getElementById('level').value = data.level;
                document.getElementById('weight').value = data.weight;
                document.getElementById('fly').checked = data.fly == 1;
                document.getElementById('game').value = data.game;
                document.getElementById('year').value = data.year;
                document.getElementById('goodness').checked = data.goodness == 1;
            });

        document.getElementById('editForm').addEventListener('submit', (event) => {
            event.preventDefault();

            const formData = new FormData();
            formData.set('level', document.getElementById('level').value.trim());
            formData.set('weight', document.getElementById('weight').value.trim());
            formData.set('fly', document.getElementById('fly').checked ? 1 : 0);
            formData.set('game', document.getElementById('game').value.trim());
            formData.set('year', document.getElementById('year').value);
            formData.set('goodness', document.getElementById('goodness').checked ? 1 : 0);

            errorBanner.hidden = true;
            successBanner.hidden = true;
            clearFieldErrors();

            fetch(`http://localhost/pikmin/${id}`, {
                method: 'PUT',
                body: formData
            })
                .then(async (response) => {
                    const json = await response.json().catch(() => null);
                    return { status: response.status, json };
                })
                .then(({ status, json }) => {

                    if (status === 400 && json && Array.isArray(json.errors)) {
                        errorBanner.innerText = 'Form has errors. Please correct them.';
                        errorBanner.hidden = false;

                        for (let err of json.errors) {
                            const el = document.getElementById(err.path + '-error');
                            if (el) el.innerText = err.msg;
                        }
                        return;
                    }

                    if (status >= 200 && status < 300) {
                        successBanner.innerText = 'Update successful!';
                        successBanner.hidden = false;
                    } else {
                        errorBanner.innerText = 'Server error.';
                        errorBanner.hidden = false;
                    }
                })
                .catch(err => {
                    console.error(err);
                    errorBanner.innerText = 'Network error.';
                    errorBanner.hidden = false;
                });
        });
    </script>

</body>

</html>
